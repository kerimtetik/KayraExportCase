name: CI

on:
  push:
    branches: [ test/v1.0.0, prod/v1.0.0, main ]
  pull_request:
    branches: [ test/v1.0.0, prod/v1.0.0, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore KayraExportCase.slnx

    - name: Build solution
      run: dotnet build KayraExportCase.slnx --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test KayraExportCase.slnx --configuration Release --no-build --logger:"console;verbosity=normal"

    - name: Verify Docker image builds
      run: |
        docker build -t kayra-auth-api:verify Auth.API/
        docker build -t kayra-product-api:verify Product.API/
        docker build -t kayra-log-api:verify Log.API/
        docker build -t kayra-api-gateway:verify ApiGateway/
